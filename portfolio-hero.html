<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SLB Portfolio — Hero</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/portfolio-hero.css">
</head>
<body>
  <header class="hero">
    <div class="wrap hero-inner">
      <div class="hero-text">
        <h1>SLB Creative Work</h1>
        <p>Showcase a single project or a featured image with large typography and call to action.</p>
        <p><a class="btn" href="#work">View Work</a></p>
      </div>
      <div class="hero-image"><img src="images/hero.jpg" alt="Featured project"></div>
    </div>
  </header>

  <main class="wrap" id="work">
    <section class="grid small">
      <article><img src="images/photo1.jpg" alt="1"><h3>Project 1</h3></article>
      <article><img src="images/photo2.jpg" alt="2"><h3>Project 2</h3></article>
      <article><img src="images/photo3.jpg" alt="3"><h3>Project 3</h3></article>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">© SLB Portfolio</div>
  </footer>
</body>
</html>
